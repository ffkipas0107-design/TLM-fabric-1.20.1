architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Wajib di Loom 1.13+ supaya :common bisa resolve class Minecraft & mappings
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()

    // Fabric Loader hanya dipakai untuk anotasi @Environment.
    // JANGAN pakai class lain dari Fabric Loader di :common.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API (common) — Event<>, ClientLifecycleEvent, PlayerEvent, dst.
    modCompileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Forge Config API Port — supaya :common lihat ForgeConfigSpec di compile-time.
    // Runtime: Forge disediakan Forge sendiri, Fabric lewat modImplementation di :fabric.
    modCompileOnly "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"

    // ImageStream — decode avif/webp/jpeg. Di-bundle jar-in-jar oleh :forge/:fabric.
    compileOnly "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
}

// Native build (CMake) — DIMATIKAN.
// Task ini butuh CMake + toolchain lokal; GitHub Actions default nggak punya
// dan bikin build gagal. Kalau perlu native, aktifkan manual + install CMake di workflow.
tasks.register('compileNative') {
    enabled = false
    doLast {
        println "compileNative is disabled. Enable it manually if you have CMake + native toolchain."
    }
}

processResources.dependsOn compileNative
