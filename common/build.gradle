architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // Memuat pustaka dasar Minecraft sesuai versi properti yang ditentukan (1.21.11)
    minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
    
    // PERBAIKAN: Menggunakan metode pemetaan langsung untuk proyek Architectury.
    // Metode ini memastikan seluruh kelas game dipetakan ke Official Mojang Mappings
    // dan dialirkan ke classpath kompilasi subproyek :common secara sempurna.
    mappings loom.officialMojangMappings()

    // Fabric Loader hanya dipakai untuk anotasi @Environment.
    // JANGAN pakai class lain dari Fabric Loader di :common.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API (common) — Menyediakan Event<>, ClientLifecycleEvent, PlayerEvent, dll.
    modCompileOnly "dev.architectury:architectury:$rootProject.architectury_api_version"

    // Forge Config API Port — Menyelesaikan error 'cannot find symbol class ModConfig' di compile-time.
    modCompileOnly "maven.modrinth:forge-config-api-port:$rootProject.forge_config_api_port_version"

    // ImageStream — Digunakan untuk mendekode format gambar avif/webp/jpeg.
    compileOnly "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
}

// Native build (CMake) — DIMATIKAN.
// Task ini butuh CMake + toolchain lokal; GitHub Actions default tidak menyediakannya.
tasks.register('compileNative') {
    enabled = false
    doLast {
        println "compileNative is disabled. Enable it manually if you have CMake + native toolchain."
    }
}

processResources.dependsOn compileNative
