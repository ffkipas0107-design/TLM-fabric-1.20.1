plugins {
    // PERBAIKAN: Naikkan ke versi 1.14-SNAPSHOT agar mendukung penuh pemetaan official Mojang di 1.21.11
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    
    // Gunakan plugin Architectury versi stabil untuk siklus 1.21+
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    
    // Versi Shadow plugin yang stabil dan kompatibel dengan Java 21 & Gradle 8.11+
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()

        flatDir {
            dirs rootProject.file('libs')
        }

        // Repositori Resmi Fabric
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        // Modrinth Maven
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }

        // Architectury Maven
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content {
                includeGroup "dev.architectury"
            }
        }

        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.OpenYSM"
                includeGroup "com.github.TartaricAlkaline"
            }
        }

        // SpongePowered Maven
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
            content {
                includeGroup "org.spongepowered"
            }
        }

        // Ladysnake Maven (Sesuai dokumentasi resmi Cardinal Components)
        maven {
            name = "Ladysnake"
            url = "https://maven.ladysnake.org/releases"
        }

        // TerraformersMC Maven (Sesuai dokumentasi resmi ModMenu)
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases"
            content {
                includeGroup "com.terraformersmc"
            }
        }

        // Mojang Libraries Maven
        maven {
            name = "Mojang"
            url = "https://libraries.minecraft.net/"
        }

        // NeoForged Maven
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        // Dengan Loom 1.14-SNAPSHOT, pemetaan official Mojang di bawah ini 
        // akan di-remap dengan aman dan otomatis ke intermediary di subproyek :fabric
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom akan melampirkan sourcesJar secara otomatis ke task kompilasi
        withSourcesJar()

        // Sesuai standar ekosistem 1.21.11, kompilasi wajib dikunci pada Java 21
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.compilerArgs.addAll([
                '-Xlint:none',
                '-Xlint:-deprecation',
                '-Xlint:-removal',
                '-Xlint:-unchecked',
                '-nowarn'
        ])
    }

    // Konfigurasi publikasi Maven
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        repositories {
            // Tempat penampungan build lokal jika diperlukan (bisa dikosongkan)
        }
    }
}
