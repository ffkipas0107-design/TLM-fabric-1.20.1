plugins {
    // Menggunakan versi Architectury Loom resmi yang stabil untuk penanganan toolchain Java 21
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    // PERBAIKAN URUTAN BUILD: Memaksa modul :fabric menunggu modul :common selesai diproduksi
    if (project.name == 'fabric') {
        evaluationDependsOn(':common')
    }

    base {
        // Penamaan suffix otomatis untuk output mod standar Gradle 9.x
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()

        flatDir {
            dirs rootProject.file('libs')
        }

        // Repositori Resmi Fabric
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        // Modrinth Maven (Diperbaiki ke URL API Maven yang valid)
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }

        // Architectury Maven
        maven {
            name = "Architectury"
            url = "https://architectury.dev"
            content {
                includeGroup "dev.architectury"
            }
        }

        // Jalur Pustaka JitPack
        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.OpenYSM"
                includeGroup "com.github.TartaricAlkaline"
            }
        }

        // SpongePowered Maven
        maven {
            name = "Sponge"
            url = "https://spongepowered.org"
            content {
                includeGroup "org.spongepowered"
            }
        }

        // Ladysnake Maven (Cardinal Components)
        maven {
            name = "Ladysnake"
            url = "https://ladysnake.org"
        }

        // TerraformersMC Maven (ModMenu)
        maven {
            name = "TerraformersMC"
            url = "https://terraformersmc.com"
            content {
                includeGroup "com.terraformersmc"
            }
        }

        // Mojang Libraries Maven
        maven {
            name = "Mojang"
            url = "https://minecraft.net"
        }

        // NeoForged Maven
        maven {
            name = "NeoForged"
            url = "https://neoforged.net"
        }
    }

    dependencies {
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.failOnError = false
        it.options.release = 21
        it.options.compilerArgs.addAll([
                '-Xlint:none',
                '-Xlint:-deprecation',
                '-Xlint:-removal',
                '-Xlint:-unchecked',
                '-nowarn'
        ])
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
        }
    }
}
