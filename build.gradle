plugins {
    // Menggunakan Loom 1.14-SNAPSHOT untuk mendukung penuh lingkungan kompilasi 1.21.11
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Penamaan suffix otomatis untuk output mod (misal: fox-model-loader-fabric)
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()

        flatDir {
            dirs rootProject.file('libs')
        }

        // Repositori Resmi Fabric
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        // Modrinth Maven
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }

        // Architectury Maven
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content {
                includeGroup "dev.architectury"
            }
        }

        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.OpenYSM"
                includeGroup "com.github.TartaricAlkaline"
            }
        }

        // SpongePowered Maven
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
            content {
                includeGroup "org.spongepowered"
            }
        }

        // Ladysnake Maven (Cardinal Components)
        maven {
            name = "Ladysnake"
            url = "https://maven.ladysnake.org/releases"
        }

        // TerraformersMC Maven (ModMenu)
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/releases"
            content {
                includeGroup "com.terraformersmc"
            }
        }

        // Mojang Libraries Maven
        maven {
            name = "Mojang"
            url = "https://libraries.minecraft.net/"
        }

        // NeoForged Maven
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
    }

    // PERBAIKAN: Blok dependencies di root DIKOSONGKAN.
    // Pemuatan minecraft dan mappings dipindahkan sepenuhnya ke file build.gradle masing-masing sub-proyek.
    dependencies {
    }

    java {
        withSourcesJar()
        // Mengunci target lingkungan ke Java 21 sesuai standar Minecraft 1.21.11
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.compilerArgs.addAll([
                '-Xlint:none',
                '-Xlint:-deprecation',
                '-Xlint:-removal',
                '-Xlint:-unchecked',
                '-nowarn'
        ])
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
        }
    }
}
