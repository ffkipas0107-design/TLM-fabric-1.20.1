plugins {
    // Ubah dari '1.9-SNAPSHOT' menjadi '1.13.467' agar sesuai tuntutan error
    id 'dev.architectury.loom' version '1.13.467' apply false
    id 'architectury-plugin' version '3.4-SNAPSHOT'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()

        flatDir {
            dirs rootProject.file('libs')
        }

        // Repositori Resmi Fabric
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        // Modrinth Maven
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }

        // Architectury Maven
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content {
                includeGroup "dev.architectury"
            }
        }

        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.OpenYSM"
                includeGroup "com.github.TartaricAlkaline"
            }
        }

        // SpongePowered Maven
        maven {
            name = "Sponge"
            url = "https://repo.spongepowered.org/repository/maven-public/"
            content {
                includeGroup "org.spongepowered"
            }
        }

        // Ladysnake Maven
        maven {
            name = "Ladysnake"
            url = "https://maven.ladysnake.org"
        }

        // TerraformersMC Maven
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
            content {
                includeGroup "com.terraformersmc"
            }
        }

        // Mojang Libraries Maven
        maven {
            name = "Mojang"
            url = "https://libraries.minecraft.net/"
        }

        // NeoForged Maven
        maven {
            name = "NeoForged"
            url = "https://maven.neoforged.net/releases/"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        // Menggunakan metode pemetaan resmi yang klop dengan Loom versi baru
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.compilerArgs.addAll([
                '-Xlint:none',
                '-Xlint:-deprecation',
                '-Xlint:-removal',
                '-Xlint:-unchecked',
                '-nowarn'
        ])
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://gradle.org for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
