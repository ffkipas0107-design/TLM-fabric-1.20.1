buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' } // <- INI PENTING
    }
    dependencies {
        classpath 'dev.architectury:architectury-loom:1.7.143'
        classpath 'dev.architectury:architectury-plugin:3.4.22'
        classpath 'com.github.johnrengelman:shadow:8.1.1'
    }
}

apply plugin: 'dev.architectury.loom'
apply plugin: 'architectury-plugin'
apply plugin: 'com.github.johnrengelman.shadow'

architectury { minecraft = project.minecraft_version }

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    if (project.name == 'fabric') {
        evaluationDependsOn(':common')
    }

    base { archivesName = "$rootProject.archives_name-$project.name" }

    repositories {
        mavenCentral()
        flatDir { dirs rootProject.file('libs') }
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }
}
