plugins {
    id 'dev.architectury.loom' version '1.14.8' apply false
    id 'architectury-plugin' version '3.4.22'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    // PERBAIKAN URUTAN BUILD: Memaksa modul :fabric menunggu modul :common selesai diproduksi
    if (project.name == 'fabric') {
        evaluationDependsOn(':common')
    }

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()

        flatDir {
            dirs rootProject.file('libs')
        }

        // Repositori Resmi Fabric
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }

        // Modrinth Maven
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content {
                includeGroup "maven.modrinth"
            }
        }

        // Architectury Maven
        maven {
            name = "Architectury"
            url = "https://maven.architectury.dev/"
            content {
                includeGroup "dev.architectury"
            }
        }

        // Ladysnake Maven - URL BENER
        maven {
            name = "Ladysnake"
            url = "https://maven.ladysnake.org/"
        }

        // TerraformersMC Maven
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
            content {
                includeGroup "com.terraformersmc"
            }
        }

        // Shedaniel Maven - BUAT MODMENU
        maven {
            name = "Shedaniel"
            url = "https://maven.shedaniel.me/"
        }

        // Jalur Pustaka JitPack
        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.TartaricAlkaline"
            }
        }
    }

    dependencies {
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        options.compilerArgs.addAll([
                '-Xlint:none',
                '-Xlint:-deprecation',
                '-Xlint:-removal',
                '-Xlint:-unchecked'
        ])
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
        }
    }
}
