plugins {
    // Diperbarui ke versi stabil untuk mendukung penataan library Java 21 di Minecraft 1.21.11
    id 'dev.architectury.loom' version '1.7.414' apply false
    id 'architectury-plugin' version '3.4.153'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // Set up a suffixed format for the mod jar names, e.g. `example-fabric`.
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        flatDir {
            dirs rootProject.file('libs')
        }
        maven {
            name = "Modrinth"
            url = "https://modrinth.com"
            content {
                includeGroup "maven.modrinth"
            }
        }
        maven {
            name = "Architectury"
            url = "https://architectury.dev"
            content {
                includeGroup "dev.architectury"
            }
        }
        maven {
            name = "JitPack"
            url = "https://jitpack.io"
            content {
                includeGroup "com.github.OpenYSM"
                includeGroup "com.github.TartaricAlkaline"
            }
        }
        maven {
            name = "Sponge"
            url = "https://spongepowered.org"
            content {
                includeGroup "org.spongepowered"
            }
        }
        maven {
            name = "Ladysnake"
            url = "https://ladysnake.org"
        }
        maven {
            name = "TerraformersMC"
            url = "https://terraformersmc.com"
            content {
                includeGroup "com.terraformersmc"
            }
        }
        // Ditambahkan agar Gradle bisa menarik repositori resmi Mojang
        maven {
            name = "Mojang"
            url = "https://minecraft.net"
        }
        // Ditambahkan sebagai library cadangan jika pemetaan membutuhkan file dependency NeoForge
        maven {
            name = "NeoForged"
            url = "https://neoforged.net"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        // Menggunakan metode pemetaan resmi yang klop dengan Loom versi baru
        mappings loom.officialMojangMappings()
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
        it.options.compilerArgs.addAll([
                '-Xlint:none',
                '-Xlint:-deprecation',
                '-Xlint:-removal',
                '-Xlint:-unchecked',
                '-nowarn'
        ])
    }

    // Configure Maven publishing.
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }

        // See https://gradle.org for information on how to set up publishing.
        repositories {
            // Add repositories to publish to here.
            // Notice: This block does NOT have the same function as the block in the top level.
            // The repositories here will be used for publishing your artifact, not for
            // retrieving dependencies.
        }
    }
}
