buildscript {
    repositories {
        gradlePluginPortal()
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
    }
    dependencies {
        classpath 'dev.architectury:architectury-loom:1.14.8'
        classpath 'dev.architectury:architectury-plugin:3.4.22'
        classpath 'com.github.johnrengelman:shadow:8.1.1'
    }
}

apply plugin: 'dev.architectury.loom'
apply plugin: 'architectury-plugin'
apply plugin: 'com.github.johnrengelman.shadow'

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    if (project.name == 'fabric') {
        evaluationDependsOn(':common')
    }

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        mavenCentral()
        flatDir { dirs rootProject.file('libs') }
        maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
        maven { name = "Modrinth"; url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
        maven { name = "Architectury"; url = "https://maven.architectury.dev/"; content { includeGroup "dev.architectury" }
        maven { name = "Ladysnake"; url = "https://maven.ladysnake.org/" }
        maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/"; content { includeGroup "com.terraformersmc" }
        maven { name = "Shedaniel"; url = "https://maven.shedaniel.me/" }
        maven { name = "JitPack"; url = "https://jitpack.io"; content { includeGroup "com.github.TartaricAlkaline" }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
        options.compilerArgs.addAll(['-Xlint:none', '-Xlint:-deprecation', '-Xlint:-removal', '-Xlint:-unchecked'])
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        repositories {
        }
    }
}
