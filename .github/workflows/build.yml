name: Build TouhouLittleMaid LITE - Fixed

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Extract Source Code
      run: |
        echo "📦 Extracting source..."
        unzip -q TouhouLittleMaid-Orihime-1.20.1.zip -d extracted/
        cp -r extracted/TouhouLittleMaid-Orihime-1.20.1/* .
        echo "✅ Extract done"

    - name: 🔧 Fix Missing Dependencies
      run: |
        echo "🛠️ Fixing build.gradle dependencies..."
        
        # Comment out problematic dependencies
        sed -i 's/modImplementation "libs:TACZ-Refabricated/modCompileOnly "libs:TACZ-Refabricated/g' build.gradle
        sed -i 's/modImplementation "libs:SlashBlade/modCompileOnly "libs:SlashBlade/g' build.gradle
        sed -i 's/modImplementation("libs:TACZ/modCompileOnly("libs:TACZ/g' build.gradle
        sed -i 's/modImplementation("libs:SlashBlade/modCompileOnly("libs:SlashBlade/g' build.gradle
        
        echo "📝 Modified dependencies:"
        grep -i "tacz\|slash" build.gradle || echo "None found"

    - name: ⚙️ Setup Gradle
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4g
        org.gradle.internal.http.socketTimeout=180000
        org.gradle.internal.http.connectionTimeout=180000
        org.gradle.parallel=true
        org.gradle.caching=true
        EOF
        chmod +x ./gradlew

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 🚀 Build (Retry 3x)
      run: |
        for i in {1..3}; do
          echo "Build attempt $i/3..."
          if ./gradlew build -x test --parallel 2>&1 | tail -50; then
            echo "✅ Build successful!"
            exit 0
          fi
          echo "⚠️ Retrying in 30s..."
          sleep 30
        done
        echo "❌ Build failed"
        exit 1

    - name: 📦 Find & Copy JAR
      if: success()
      run: |
        mkdir -p output
        find build/libs -name "*.jar" ! -name "*sources*" ! -name "*dev*" -exec cp {} output/ \;
        ls -lah output/
        [ -f output/*.jar ] || exit 1

    - name: 🎉 Upload to Releases
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.jar
        tag_name: "v${{ github.run_number }}"
        name: "TouhouLittleMaid LITE v${{ github.run_number }}"
        body: "✅ Build successful! JAR ready for Minecraft 1.20.1 Fabric"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📥 Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TouhouLittleMaid-LITE
        path: output/*.jar
