name: Build TouhouLittleMaid LITE - RAM 2GB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Extract Source Code
      run: |
        echo "📦 Extracting..."
        unzip -q TouhouLittleMaid-Orihime-1.20.1.zip -d extracted/
        cp -r extracted/TouhouLittleMaid-Orihime-1.20.1/* .
        echo "✅ Done"

    - name: 🔧 Remove Heavy Dependencies from build.gradle
      run: |
        echo "🛠️ Removing TACZ, SlashBlade, dll..."
        # Comment semua modImplementation "libs:..."
        sed -i 's/modImplementation "libs:/\/\/ LITE: modImplementation "libs:/g' build.gradle
        sed -i 's/modImplementation("libs:/\/\/ LITE: modImplementation("libs:/g' build.gradle
        
        echo "✅ Dependencies removed"
        echo ""
        echo "Sample build.gradle:"
        grep -i "modImplementation" build.gradle | head -10

    - name: Setup Gradle
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx3g
        org.gradle.internal.http.socketTimeout=120000
        org.gradle.internal.http.connectionTimeout=120000
        org.gradle.parallel=true
        EOF
        chmod +x ./gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 🚀 Build LITE
      run: ./gradlew build -x test --parallel

    - name: 📦 Find JAR
      run: |
        mkdir -p output
        find build/libs -name "*.jar" ! -name "*sources*" ! -name "*dev*" -exec cp {} output/ \;
        echo "JAR created:"
        ls -lah output/

    - name: 🎉 Upload Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.jar
        tag_name: "v-lite-${{ github.run_number }}"
        name: "TouhouLittleMaid LITE v${{ github.run_number }}"
        body: |
          ✅ **TouhouLittleMaid LITE - Optimized untuk RAM 2GB!**
          
          🎉 Hanya TouhouLittleMaid + Fabric API
          ✅ TACZ, SlashBlade, FarmersDelight = DIHAPUS
          ✅ Super LITE & berat
          
          📱 Cocok untuk Oppo A3S!
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📥 Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TouhouLittleMaid-LITE
        path: output/*.jar
