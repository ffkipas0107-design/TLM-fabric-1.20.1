name: Build TouhouLittleMaid LITE - RAM 2GB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Extract Source Code
      run: |
        echo "📦 Extracting..."
        unzip -q TouhouLittleMaid-Orihime-1.20.1.zip -d extracted/
        cp -r extracted/TouhouLittleMaid-Orihime-1.20.1/* .
        echo "✅ Done"

    - name: 🔧 Create LITE build.gradle (Remove Heavy Mods)
      run: |
        echo "Creating LITE version..."
        cat > build.gradle << 'GRADLE_EOF'
plugins {
  id 'fabric-loom' version '1.10.5'
  id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
  mavenCentral()
  maven { url "https://maven.fabricmc.net/" }
  maven { url "https://maven.modmuss50.me/" }
}

dependencies {
  minecraft "com.mojang:minecraft:${project.minecraft_version}"
  mappings loom.officialMojangMappings()
  modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
  modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

tasks.withType(JavaCompile).configureEach {
  it.options.release = 17
}

jar {
  from "LICENSE"
  classifier = "dev"
}

sourcesJar {
  from "LICENSE"
}

remapJar {
  injectAccessWidener = true
  remapperArgs = [
    "-ext", "quilt"
  ]
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }

  repositories {
    mavenLocal()
  }
}
GRADLE_EOF
        echo "✅ LITE build.gradle created"

    - name: Setup Gradle
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx3g
        org.gradle.internal.http.socketTimeout=120000
        org.gradle.internal.http.connectionTimeout=120000
        org.gradle.parallel=true
        EOF
        chmod +x ./gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 🚀 Build LITE
      run: ./gradlew build -x test --parallel

    - name: 📦 Find JAR
      run: |
        mkdir -p output
        find build/libs -name "*.jar" ! -name "*sources*" ! -name "*dev*" -exec cp {} output/ \;
        echo "JAR created:"
        ls -lah output/

    - name: 🎉 Upload Release
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.jar
        tag_name: "v-lite-${{ github.run_number }}"
        name: "TouhouLittleMaid LITE v${{ github.run_number }} (RAM 2GB)"
        body: |
          ✅ **TouhouLittleMaid LITE - Optimized untuk RAM 2GB!**
          
          🎉 **Hanya TouhouLittleMaid + Fabric API**
          ✅ TACZ, SlashBlade, FarmersDelight = DIHAPUS
          ✅ Super LITE, cocok untuk HP Oppo A3S
          
          📱 **Cara pakai:**
          1. Download JAR
          2. Masukkan ke folder mods (Fabric 1.20.1)
          3. Done! 🚀
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📥 Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TouhouLittleMaid-LITE-RAM2GB
        path: output/*.jar
