name: Debug - List ZIP Contents

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Lihat Struktur ZIP
      run: |
        echo "=== ZIP File Info ==="
        ls -lh TouhouLittleMaid-Orihime-1.20.1.zip
        
        echo ""
        echo "=== Unzip & List Semua File ==="
        unzip -l TouhouLittleMaid-Orihime-1.20.1.zip | head -100
        
        echo ""
        echo "=== Extract ==="
        unzip -q TouhouLittleMaid-Orihime-1.20.1.zip -d extracted/
        
        echo ""
        echo "=== Struktur Folder ==="
        find extracted -type f -name "*.jar" -o -name "build.gradle" -o -name "*.md" | sort
        
        echo ""
        echo "=== Folder Utama ==="
        ls -la extracted/
        
        echo ""
        echo "=== Cari semua .jar file ==="
        find extracted -name "*.jar" -type f -exec ls -lh {} \;
