name: Enterprise Multiloader CI/CD Pipeline

'on':
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable Gradle Debug & Stacktrace'
        required: false
        default: false
        type: boolean
      force_release:
        description: 'Force generate a draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read
  checks: write
  actions: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  security-and-validation:
    name: 🔒 Security & Wrapper Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper Checksum
        uses: gradle/wrapper-validation-action@v2

      - name: Check Repository Structure
        run: |
          echo "=== Active Git Branch ==="
          git branch --show-current
          echo "=== Detected Mod Modules ==="
          ls -la

  build-matrix:
    name: ⚙️ Build Mod (Java ${{ matrix.java-version }})
    needs: security-and-validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}

      - name: Setup Gradle Cache & Optimization
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Compile Mod & Run Unit Tests
        run: |
          if [ "${{ github.event.inputs.debug_mode }}" = "true" ]; then
            ./gradlew build check --stacktrace --info
          else
            ./gradlew build check
          fi

      - name: Upload Build Artifacts (JARs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-artifacts-java-${{ matrix.java-version }}
          path: |
            build/libs/*.jar
            */build/libs/*.jar
            !**/transform_cache/*
          if-no-files-found: ignore
          retention-days: 14

  test-reporting:
    name: 📊 Analysis & Test Reporting
    needs: build-matrix
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Test Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Generate GitHub Step Summary
        run: |
          echo "### 🚀 Build Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Name | File Size | Location |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          find ./artifacts -name "*.jar" -exec ls -lh {} \; | while read -r line; do
            SIZE=$(echo "$line" | awk '{print $5}')
            FILE=$(echo "$line" | awk '{print $9}')
            NAME=$(basename "$FILE")
            echo "| \`$NAME\` | **$SIZE** | \`$FILE\` |" >> $GITHUB_STEP_SUMMARY
          done

  release-deploy:
    name: 📦 Automated GitHub Release
    needs: [build-matrix, test-reporting]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.force_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Final Java 21 Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mod-artifacts-java-21
          path: ./dist-release

      - name: Prepare Release Files
        run: |
          mkdir -p ./final-release
          find ./dist-release -name "*.jar" -exec cp {} ./final-release/ \;
          ls -la ./final-release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./final-release/*.jar
          generate_release_notes: true
          draft: ${{ github.event.inputs.force_release == 'true' }}
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
