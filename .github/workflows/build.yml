name: Build TouhouLittleMaid LITE - Optimized

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Extract Source Code
      run: |
        echo "Extracting source code..."
        if [ -f "TouhouLittleMaid-Orihime-1.20.1.zip" ]; then
          unzip -q TouhouLittleMaid-Orihime-1.20.1.zip -d extracted/
          
          for dir in extracted/*/; do
            if [ -d "$dir/src" ]; then
              cp -r "$dir"/* .
              break
            fi
          done
        else
          echo "ERROR: File TouhouLittleMaid-Orihime-1.20.1.zip tidak ditemukan!"
          exit 1
        fi

    - name: Trik Optimasi LITE (Tanpa Merusak Java)
      run: |
        echo "Mengubah mod berat menjadi Compile-Only..."
        
        sed -i 's/modImplementation("vectorwing:FarmersDelight/modCompileOnly("vectorwing:FarmersDelight/g' build.gradle
        sed -i 's/modImplementation "libs:TACZ/modCompileOnly "libs:TACZ/g' build.gradle
        sed -i 's/modImplementation "net.conczin:immersive_melodies/modCompileOnly "net.conczin:immersive_melodies/g' build.gradle
        sed -i 's/modImplementation("maven.modrinth:travelersbackpack/modCompileOnly("maven.modrinth:travelersbackpack/g' build.gradle

    # ⭐ TAMBAHAN: Fix Maven Timeout & Cache Dependencies
    - name: Create gradle.properties untuk Timeout
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties << 'EOF'
        org.gradle.internal.http.socketTimeout=120000
        org.gradle.internal.http.connectionTimeout=120000
        org.gradle.vfs.watch.enabled=false
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # ⭐ TAMBAHAN: Pre-download Dependencies dengan Retry
    - name: Download Dependencies (dengan Retry)
      run: |
        chmod +x ./gradlew
        for i in {1..3}; do
          echo "Attempt $i to download dependencies..."
          ./gradlew build --dry-run -Dorg.gradle.jvmargs="-Xmx3g" && break || sleep 30
        done

    - name: Mulai Nge-Build (.jar)
      run: |
        chmod +x ./gradlew
