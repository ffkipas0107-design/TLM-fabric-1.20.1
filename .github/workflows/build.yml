name: Build TouhouLittleMaid LITE - Optimized

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Extract Source Code
      run: |
        echo "Extracting source code..."
        if [ -f "TouhouLittleMaid-Orihime-1.20.1.zip" ]; then
          unzip -q TouhouLittleMaid-Orihime-1.20.1.zip -d extracted/
          
          # Cari dan salin seluruh folder source ke directory utama
          for dir in extracted/*/; do
            if [ -d "$dir/src" ]; then
              cp -r "$dir"/* .
              break
            fi
          done
        else
          echo "ERROR: File TouhouLittleMaid-Orihime-1.20.1.zip tidak ditemukan!"
          exit 1
        fi

    - name: Trik Optimasi LITE (Tanpa Merusak Java)
      run: |
        echo "Mengubah mod berat menjadi Compile-Only agar tidak wajib saat dimainkan..."
        
        # Akali build.gradle agar mod berat hanya dipinjam saat compile (Anti Error Line 50)
        sed -i 's/modImplementation("vectorwing:FarmersDelight/modCompileOnly("vectorwing:FarmersDelight/g' build.gradle
        sed -i 's/modImplementation "libs:TACZ/modCompileOnly "libs:TACZ/g' build.gradle
        sed -i 's/modImplementation "net.conczin:immersive_melodies/modCompileOnly "net.conczin:immersive_melodies/g' build.gradle
        sed -i 's/modImplementation("maven.modrinth:travelersbackpack/modCompileOnly("maven.modrinth:travelersbackpack/g' build.gradle
        
        echo "Optimasi selesai! Kodingan Java tetap aman."

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Mulai Nge-Build (.jar)
      run: |
        chmod +x ./gradlew
        ./gradlew build -x test --parallel -Dorg.gradle.jvmargs="-Xmx3g" --info

    - name: Upload Langsung Jadi File .jar ke Releases
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: build/libs/*.jar
        tag_name: "v1.0-lite-${{ github.run_number }}"
        name: "TouhouLittleMaid LITE Siap Pakai (#${{ github.run_number }})"
        body: |
          🎉 **TouhouLittleMaid LITE - Optimized Build**
          
          ✅ **Fitur yang Dipertahankan:**
          - Spawn & manajemen Maid
          - Model 3D Maid (GeckoLib aman)
          - Suara / Voice Maid berfungsi normal
          
          ⚡ **Optimasi untuk RAM 2GB:**
          - Farmer's Delight (Tidak wajib dipasang lagi!)
          - TACZ Weapon (Tidak wajib dipasang lagi!)
          - Traveler's Backpack & Immersive Melodies (Opsional/Dibuang dari beban runtime)
          
          🎮 **Cara Pasang di HP:**
          1. Download file `.jar` di bawah ini (bukan zip).
          2. Masukkan ke folder `mods` Minecraft 1.20.1 Fabric.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
