name: Enterprise Multiloader CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable Gradle Debug & Stacktrace'
        required: false
        default: false
        type: boolean
      force_release:
        description: 'Force generate a draft release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read
  checks: write
  actions: read

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  security-and-validation:
    name: Security & Wrapper Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gradle/wrapper-validation-action@v2
      - run: |
          echo "=== Active Git Branch ==="
          git branch --show-current
          echo "=== Detected Mod Modules ==="
          ls -la

  build-project:
    name: Build Mod Java 21
    needs: security-and-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - run: chmod +x ./gradlew
      - name: Clean Old Build
        run: ./gradlew clean
      - name: Build Mod
        run: |
          if [ "${{ inputs.debug_mode }}" = "true" ]; then
            ./gradlew build --stacktrace --info
          else
            ./gradlew build
          fi
      - name: Upload Fabric Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: yes-steve-model-fabric-1.21.11
          path: fabric/build/libs/*-fabric.jar
          if-no-files-found: error
          retention-days: 7

  release-deploy:
    name: Auto Release
    needs: build-project
    if: startsWith(github.ref, 'refs/tags/v') || inputs.force_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: yes-steve-model-fabric-1.21.11
          path: ./dist-release
      - uses: softprops/action-gh-release@v2
        with:
          files: ./dist-release/*.jar
          generate_release_notes: true
          draft: ${{ inputs.force_release == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
