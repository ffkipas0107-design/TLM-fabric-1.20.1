name: Build TouhouLittleMaid LITE - Auto Fix

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Extract Source Code
      run: |
        echo "📦 Extracting..."
        unzip -q TouhouLittleMaid-Orihime-1.20.1.zip -d extracted/
        cp -r extracted/TouhouLittleMaid-Orihime-1.20.1/* .
        echo "✅ Done"

    - name: 🔧 Auto-Fix Missing Dependencies
      run: |
        echo "🛠️ Commenting problematic dependencies..."
        
        # Comment modImplementation yang bermasalah
        sed -i 's/^\s*modImplementation "libs:/\/\/ modImplementation "libs:/g' build.gradle
        sed -i 's/^\s*modImplementation("libs:/\/\/ modImplementation("libs:/g' build.gradle
        
        # Tapi keep fabric API dan core
        sed -i 's/\/\/ modImplementation "net.fabricmc.fabric-api/modImplementation "net.fabricmc.fabric-api/g' build.gradle
        sed -i 's/\/\/ modImplementation("net.fabricmc/modImplementation("net.fabricmc/g' build.gradle
        
        echo "📝 Modified build.gradle (sample):"
        grep -i "modImplementation\|modCompile" build.gradle | head -15 || echo "None"

    - name: Setup Gradle
      run: |
        mkdir -p ~/.gradle
        cat >> ~/.gradle/gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx4g
        org.gradle.internal.http.socketTimeout=180000
        org.gradle.internal.http.connectionTimeout=180000
        org.gradle.parallel=true
        org.gradle.caching=true
        EOF
        chmod +x ./gradlew

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 🚀 Build
      run: |
        echo "Building..."
        ./gradlew build -x test --parallel --info 2>&1 | tail -100

    - name: 🔍 Find JAR
      run: |
        echo "Searching for JAR files..."
        mkdir -p output
        
        # Find all JAR
        find . -name "*TouhouLittleMaid*.jar" -o -name "*maid*.jar" 2>/dev/null | grep -v "sources\|dev" > jar_list.txt
        cat jar_list.txt || echo "No TouhouLittleMaid JAR found"
        
        # Fallback: copy semua dari build/libs
        find build/libs -name "*.jar" ! -name "*sources*" ! -name "*dev*" -exec cp {} output/ \; 2>/dev/null
        
        echo "📦 Output:"
        ls -lah output/ || echo "Empty"

    - name: 🎉 Upload Releases
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        files: output/*.jar
        tag_name: "v${{ github.run_number }}"
        name: "TouhouLittleMaid LITE #${{ github.run_number }}"
        body: "✅ Berhasil! JAR siap untuk Minecraft 1.20.1 Fabric"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 📥 Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TouhouLittleMaid-LITE
        path: output/*.jar
