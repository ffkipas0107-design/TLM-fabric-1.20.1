plugins {
    id 'fabric-loom' version '1.11.7'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = rootProject.maven_group
version = rootProject.mod_version

repositories {
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com' }
    maven { url 'https://maven.shedaniel.me' }
    maven { url 'https://jitpack.io' }
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    splitEnvironmentSourceSets()
}

archivesBaseName = "yes-steve-model-fabric" // <- TAMBAH INI BIAR NAMA JAR KONSISTEN

dependencies {
    minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // LIBRARY
    modImplementation "maven.modrinth:forge-config-api-port:${rootProject.forge_config_api_port_version}"
    modImplementation("dev.architectury:architectury-fabric:${rootProject.architectury_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api"
    }
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"
    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    modImplementation "software.bernie.geckolib:geckolib:${rootProject.geckolib_version}" // <- TAMBAH GECKOLIB

    // AMBIL KODE DARI COMMON DOANG
    modImplementation project(':common')
}

// GABUNGIN RESOURCE DARI COMMON TAPI JANGAN MIXINS.JSON
processResources {
    inputs.property 'version', project.version
    filesMatching('*.mixins.json') { expand version: project.version }
    filesMatching('fabric.mod.json') { expand version: project.version } // <- TAMBAH INI
    from(project(':common').sourceSets.main.resources.srcDirs) {
        exclude '**/*.mixins.json' // PENTING: JANGAN COPY MIXINS DARI COMMON
        exclude 'fabric.mod.json'
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// SHADOW CONFIG
shadowJar {
    configurations = [project.configurations.runtimeClasspath]
    archiveClassifier = ''
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

// REMAP JAR SETELAH DI SHADOW - PAKE archivesBaseName BIAR OTOMATIS
remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName = "${archivesBaseName}-${project.version}-fabric-${rootProject.minecraft_version}.jar" // <- GANTI JADI INI
}

build.dependsOn remapJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
