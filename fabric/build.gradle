plugins {
    // Pada arsitektur Architectury Multiloader, plugin 'dev.architectury.loom' tidak boleh di-apply ulang secara manual dengan versi berbeda agar tidak bentrok
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = rootProject.maven_group
version = rootProject.mod_version

repositories {
    mavenCentral()
    maven { url 'https://terraformersmc.com' }
    maven { url 'https://shedaniel.me' }
    maven { url 'https://jitpack.io' }
    flatDir { dirs 'libs' } 
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    splitEnvironmentSourceSets()
}

// Menggunakan format pemetaan Gradle 9.x komponen tunggal base
base {
    archivesName = "yes-steve-model-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "maven.modrinth:forge-config-api-port:${rootProject.forge_config_api_port_version}"
    modImplementation("dev.architectury:architectury-fabric:${rootProject.architectury_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api"
    }
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:$rootProject.cardinal_components_version"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:$rootProject.cardinal_components_version"
    implementation "com.github.TartaricAlkaline:ImageStream:-SNAPSHOT"
    modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
    
    modImplementation name: 'geckolib-fabric-1.21.11-5.4.5' 

    // Dependensi kompilasi internal
    compileOnly project(path: ':common', configuration: 'namedElements')
    modImplementation project(':common')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('*.mixins.json') { expand version: project.version }
    filesMatching('fabric.mod.json') { expand version: project.version }
    from(project(':common').sourceSets.main.resources.srcDirs) {
        exclude '**/*.mixins.json'
        exclude 'fabric.mod.json'
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

shadowJar {
    configurations = [project.configurations.runtimeClasspath]
    archiveClassifier = ''
    mergeServiceFiles()
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveFileName = "${base.archivesName.get()}-${project.version}-fabric-${rootProject.minecraft_version}.jar"
}

build.dependsOn remapJar

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
